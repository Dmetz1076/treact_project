<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treact</title>
  <link rel="stylesheet" href="style.css">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
</style>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="nav__row">
        <div class="nav__logo">
          <img class="nav__logo--img" src="assets/logo.2c489fc453a1783cbadacf914efa3df6.svg" alt="Treact Logo">
          <div class="logo__title">Treact
          </div>
        </div>
        <div class="nav__links">
          <a href="#" class="nav__link">About</a>
          <a href="#" class="nav__link">Blog</a>
          <a href="#" class="nav__link">Pricing</a>
          <a href="#" class="nav__link">Contact Us</a>
          <a href="#" class="nav__link login">Login</a>
          <a href="#" class="nav__link signup">Sign Up</a>
        </div>
      </div>
    </nav>
    <div class="header">
      <div class="container">
        <div class="row">
          <div class="header__description">
            <h1>Beautiful React Templates <span class="purple">for you.</span>
            </h1>
            <p class="header__description--text">Our templates are easy to set up, understand and customize. Fully modular components with a variety of pages and components.
            </p>
            <div class="header__email">
              <input type="text" placeholder="Your E-mail Address"  class="header__email--input">
              <button class="header__email--btn">Get Started</button>
            </div>
            <figure class="header__img--wrapper">
              <img src="assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" class="header__img">
            </figure>
          </div>

        </div>
      </div>
    </div>
  </section>
</body>
</html>
